[package]
name = "attic-server"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["s3"]

# S3-compatible object storage backend.
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]

[lib]
name = "attic_server"
path = "src/lib.rs"

[[bin]]
name = "cellerd"
path = "src/main.rs"
doc = false

[[bin]]
name = "celleradm"
path = "src/adm/main.rs"
doc = false

[dependencies]
attic = { workspace = true, default-features = false, features = ["chunking", "io"] }
attic-token.workspace = true

anyhow.workspace = true
async-stream.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
digest.workspace = true
displaydoc.workspace = true
enum-as-inner.workspace = true
futures.workspace = true
hex.workspace = true
humantime.workspace = true
regex.workspace = true
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
sha2.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-error = "0.2.1"
xdg.workspace = true

async-trait = "0.1.88"
aws-config = { version = "1.8.16", optional = true }
aws-sdk-s3 = { version = "1.131.0", optional = true }
axum = "0.8.9"
axum-macros = "0.5.0"
# `tracing_level_info` puts the request span at INFO; it is TRACE by default,
# which the exporter's own filter drops.
axum-tracing-opentelemetry = { version = "0.39.1", features = ["tracing_level_info"] }
console-subscriber = "0.5.0"
derive_more = { version = "2.0.1", features = ["debug"] }
http-body-util = "0.1.3"
humantime-serde = "1.1.1"
itoa = "1.0.15"
opentelemetry = "0.32.0"
# The thread-based batch processor drives exports with `futures_executor`, which
# leaves tonic and async reqwest without a reactor. Export on the Tokio runtime
# instead.
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = [
	"trace",
	"internal-logs",
	"experimental_trace_batch_span_processor_with_async_runtime",
	"rt-tokio",
] }
rand = "0.10.1"
ryu = "1.0.20"
tokio-util = { version = "0.7.15", features = ["io"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "trace"] }
tracing-opentelemetry = { version = "0.33.0", default-features = false, features = ["tracing-log"] }
uuid = { version = "1.23.1", features = ["v4"] }

[dependencies.tracing-subscriber]
workspace = true
features = ["json", "registry"]

# Both OTLP transports are always compiled in; the wire protocol is picked at
# runtime from `[tracing.otlp] protocol`.
[dependencies.opentelemetry-otlp]
version = "0.32.0"
default-features = false
features = [
	"trace",
	"internal-logs",

	# grpc, port 4317
	"grpc-tonic",
	"tls-ring",
	"tls-roots",

	# http/protobuf, port 4318
	"http-proto",
	"reqwest-client",
	"reqwest-rustls",
]

[dependencies.async-compression]
version = "0.4.42"
features = [
	"tokio",
	"xz",
	"zstd",
	"brotli",
]

[dependencies.sea-orm]
version = "2.0.0-rc.40"
features = [
	"runtime-tokio-rustls",
	"macros",
	"sqlx-postgres",
	"sqlx-sqlite",
	"debug-print",
]

[dependencies.sea-orm-migration]
version = "2.0.0-rc.40"

# sea-orm currently pulls in sqlx 0.9.0. It has a regression that changes how
# the default username for postgres connections is determined. Workaround by
# explicitly enabling the `std` feature. Can be removed when sqlx has a new
# release.
#
# See: https://github.com/transact-rs/sqlx/pull/4303
[dependencies.whoami]
version = "2"
features = ["std"]

[dependencies.tokio]
workspace = true
features = [
	"fs",
	"io-util",
	"macros",
	"process",
	"rt",
	"rt-multi-thread",
	"sync",
]
